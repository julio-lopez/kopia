name: Sync Upstream
on:
  push:
    branches: [ main, local-main ]
  schedule:
    - cron: '30 5 * * 1-5'
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'target branch for repo sync'
        default: 'upstream'
        required: true
        type: choice
        options:
        - master
        - upstream
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync_fork:
    name: Sync Fork
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    -
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit
    -
      name: Sync
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh repo sync ${{ github.repository }} -b ${{ inputs.target_branch || 'upstream' }}
  fallback_sync:
    name: Fallback Sync
    if: ${{ failure() }}
    needs: sync_fork
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    -
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit
    -
      name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.target_branch || 'upstream' }}
        fetch-depth: 0
    -
      name: Update upstream branch
      run: |
        git checkout ${{ inputs.target_branch || 'upstream' }}
        git fetch https://github.com/kopia/kopia.git master
        git merge --ff-only FETCH_HEAD
        git push origin
